name: "Nightly: component plan"

on:
  workflow_call:
    inputs:
      component:
        description: "Registered component name"
        required: true
        type: string
      source_sha:
        description: "Exact source commit"
        required: true
        type: string
      force:
        description: "Build even when no relevant paths changed"
        required: false
        default: false
        type: boolean
    outputs:
      should_build:
        value: ${{ jobs.plan.outputs.should_build }}
      version:
        value: ${{ jobs.plan.outputs.version }}
      bundle_version:
        value: ${{ jobs.plan.outputs.bundle_version }}
      tag:
        value: ${{ jobs.plan.outputs.tag }}
      previous_tag:
        value: ${{ jobs.plan.outputs.previous_tag }}
      attribution_base_tag:
        value: ${{ jobs.plan.outputs.attribution_base_tag }}
      reason:
        value: ${{ jobs.plan.outputs.reason }}
      attribution_issues:
        value: ${{ jobs.plan.outputs.attribution_issues }}

permissions:
  contents: read
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.shouldBuild }}
      version: ${{ steps.plan.outputs.version }}
      bundle_version: ${{ steps.plan.outputs.bundleVersion }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previousTag }}
      attribution_base_tag: ${{ steps.attribution_base.outputs.ref }}
      reason: ${{ steps.plan.outputs.reason }}
      attribution_issues: ${{ steps.plan.outputs.attributionIssues }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source is an exact main commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Fetch published release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/releases.json"

      - name: Prepare missing stable attribution anchor
        id: attribution_bootstrap
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          VERSION_FILE=$(jq -er --arg component "$COMPONENT" \
            '.components[$component].versionAuthorityFile' \
            .github/releases/components.json)
          STABLE_PREFIX=$(jq -er --arg component "$COMPONENT" \
            '.components[$component].stableTagPrefix' \
            .github/releases/components.json)
          BASE_VERSION=$(tr -d '\r\n' < "$VERSION_FILE")
          test -n "$BASE_VERSION"
          STABLE_TAG="${STABLE_PREFIX}${BASE_VERSION}"

          if git rev-parse --verify --quiet "${STABLE_TAG}^{commit}" >/dev/null; then
            exit 0
          fi

          BASE_SHA=$(git log -n 1 --format=%H -S"$BASE_VERSION" -- "$VERSION_FILE")
          if [[ -z "$BASE_SHA" ]]; then
            echo "::error::Cannot find a commit that introduced $BASE_VERSION in $VERSION_FILE"
            exit 1
          fi
          RECORDED_VERSION=$(git show "${BASE_SHA}:${VERSION_FILE}" | tr -d '\r\n')
          if [[ "$RECORDED_VERSION" != "$BASE_VERSION" ]]; then
            echo "::error::Attribution anchor $BASE_SHA records $RECORDED_VERSION, expected $BASE_VERSION"
            exit 1
          fi
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"

          # The planner's first-nightly contract expects a stable tag. Create a
          # checkout-local alias so planning/preflight can stay tag-based, then
          # export the commit SHA for downstream jobs where this local tag does
          # not exist.
          git tag "$STABLE_TAG" "$BASE_SHA"
          {
            echo "synthetic_tag=$STABLE_TAG"
            echo "fallback_ref=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Plan immutable nightly
        id: plan
        env:
          COMPONENT: ${{ inputs.component }}
          FORCE_REQUESTED: ${{ inputs.force }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          FORCE=()
          if [[ "$FORCE_REQUESTED" == "true" ]]; then FORCE+=(--force); fi
          python3 .github/scripts/release_channels.py plan \
            --component "$COMPONENT" \
            --source-sha "$SOURCE_SHA" \
            --date "$(date -u +%Y%m%d)" \
            --run "${{ github.run_id }}" \
            --releases "$RUNNER_TEMP/releases.json" \
            --attribution-config .github/release-attribution-config.json \
            --output "$RUNNER_TEMP/nightly-plan.json" \
            --github-output "$GITHUB_OUTPUT" \
            "${FORCE[@]}"
          cat "$RUNNER_TEMP/nightly-plan.json"

      - name: Resolve portable attribution base
        id: attribution_base
        env:
          PLANNED_REF: ${{ steps.plan.outputs.attributionBaseTag }}
          SYNTHETIC_TAG: ${{ steps.attribution_bootstrap.outputs.synthetic_tag }}
          FALLBACK_REF: ${{ steps.attribution_bootstrap.outputs.fallback_ref }}
        run: |
          set -euo pipefail
          REF="$PLANNED_REF"
          if [[ -n "$SYNTHETIC_TAG" && "$PLANNED_REF" == "$SYNTHETIC_TAG" ]]; then
            REF="$FALLBACK_REF"
          fi
          test -n "$REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Preserve plan
        uses: actions/upload-artifact@v4
        with:
          name: nightly-plan-${{ inputs.component }}
          path: ${{ runner.temp }}/nightly-plan.json
          if-no-files-found: error
          retention-days: 30

  report-attribution-hold:
    needs: plan
    if: needs.plan.outputs.reason == 'held-attribution'
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh the attribution hold
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ATTRIBUTION_ISSUES: ${{ needs.plan.outputs.attribution_issues }}
        run: |
          set -euo pipefail
          TITLE="Nightly ${COMPONENT} held by unresolved contributor attribution"
          BODY="$RUNNER_TEMP/nightly-attribution-hold.md"
          {
            echo "The nightly planner stopped before the cross-platform build because contributor attribution is unresolved."
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo
            echo "Unresolved identities:"
            jq -r '.[] | "- `\(.email)` in commit `\(.sha)` (\(.name))"' <<<"$ATTRIBUTION_ISSUES"
            echo
            echo "Resolve each identity by linking the email to GitHub, amending the source commit with a recognized email before merge, or adding a verified \`identityOverrides\` mapping. Do not add wildcard or human-email ignores."
          } > "$BODY"
          MATCHES=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$TITLE\" in:title" --limit 100 --json number,title)
          NUMBER=$(jq -r --arg title "$TITLE" \
            'map(select(.title == $title)) | first | .number // empty' <<<"$MATCHES")
          if [[ -n "$NUMBER" ]]; then
            gh issue edit "$NUMBER" --repo "${{ github.repository }}" --body-file "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body-file "$BODY"
          fi
